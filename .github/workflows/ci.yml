name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r project2/requirements-dev.txt
      - name: Run unit tests
        working-directory: project2
        run: pytest -v

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: unit-tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      PGPASSWORD: ci_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r project2/requirements-dev.txt
      - name: Start Mosquitto
        run: |
          docker run -d --name mosquitto -p 1883:1883 \
            -v "$PWD/docker/mosquitto.conf:/mosquitto/config/mosquitto.conf" \
            eclipse-mosquitto:2
          sleep 3
      - name: Load schema
        run: psql -h 127.0.0.1 -U fleet -d postgres -q -f project2/scripts/schema.sql
      - name: Run end-to-end test
        run: ./project2/scripts/e2e.sh
      - name: Show consumer log on failure
        if: failure()
        run: |
          echo "--- consumer log ---"; cat /tmp/e2e_consumer.log || true
          echo "--- mosquitto log ---"; docker logs mosquitto || true
